name: LTC Node migration checks
on:
  push:
    paths: ['frontend/**', 'backend/**', 'infra/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', 'infra/**', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, backend, infra]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: '${{ matrix.project }}/package-lock.json'
      - run: npm ci
      - if: matrix.project == 'frontend'
        run: npm run lint && npm test && npm run build
        env:
          VITE_API_URL: http://localhost:8000
      - if: matrix.project == 'backend'
        run: npm run typecheck && npm test
      - if: matrix.project == 'infra'
        run: npm run typecheck && npm test
        env:
          CDK_DISABLE_VERSION_CHECK: '1'
      # No database credentials, migrations, provider calls, bootstrap or deployment.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: ltc-node:ci
